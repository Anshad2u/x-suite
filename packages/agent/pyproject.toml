[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-agent"
version = "0.2.0"
description = "Scheduling and draft-queue logic for the x-suite (scraper-only, no paid X API)"
requires-python = ">=3.11"
# No runtime dependencies: this package is pure logic. Databases, HTTP
# clients and credentials are injected by the caller.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["social_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
