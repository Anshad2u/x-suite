[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-agent"
version = "0.2.0"
description = "Scheduling and mention-watching agent for the x-suite (scraper-only, no paid X API)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
social-agent = "social_agent.cli:main"

[tool.setuptools.packages.find]
include = ["social_agent*"]
