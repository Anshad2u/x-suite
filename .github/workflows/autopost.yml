name: auto-post
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: trigger auto-post
        run: |
          RESP=$(curl -s -X POST "${{ secrets.AUTO_POST_URL }}" \
            -H "X-Auto-Post-Secret: ${{ secrets.AUTO_POST_SECRET }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "$RESP"
